<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <title data-i18next="break.title"></title>
    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <link rel="stylesheet" type="text/css" href="css/color-scheme.css">
    <link rel="stylesheet" type="text/css" href="css/commons.css">
    <link rel="stylesheet" type="text/css" href="css/quiet-rest.css">
    <link rel="stylesheet" type="text/css" href="css/break.css">
  </head>
  <body class="quiet-rest quiet-break">
    <div class="breaks">
      <div class="break-content">
        <div class="rest-badge"><img src="images/brand/restspark-mark-teal.svg" alt=""><span data-i18next="quietRest.miniTitle"></span></div>
        <div class="timer">
          <svg class="timer-ring" viewBox="0 0 120 120" aria-hidden="true">
            <defs><linearGradient id="rest-ring-gradient" x1="0" y1="0" x2="1" y2="1"><stop class="ring-start" offset="0"/><stop class="ring-end" offset="1"/></linearGradient></defs>
            <circle class="timer-track" cx="60" cy="60" r="54"/>
            <circle class="timer-remaining" cx="60" cy="60" r="54" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/>
          </svg>
          <span id="progress-time" role="timer" aria-live="off"></span>
          <img class="timer-leaf" src="images/brand/restspark-mark-teal.svg" alt="">
        </div>
        <progress id="progress" max="10000" value="10000" aria-hidden="true"></progress>
        <div class="break-message">
          <div class="microbreak-idea" dir="auto"></div>
        </div>
      </div>
      <div class="break-actions">
        <button type="button" id="postpone" class="tooltip top hidden">
          <img src="images/breaks/break-postpone.svg" alt="">
          <span data-i18next="break.postpone"></span>
          <span class="tiptext" aria-hidden="true"></span>
        </button>
        <button type="button" id="close" class="tooltip top push hidden">
          <img src="images/breaks/break-skip.svg" alt="">
          <span data-i18next="break.skip"></span>
          <span class="tiptext" aria-hidden="true"></span>
        </button>
        <button type="button" id="finish" class="tooltip top push hidden">
          <img src="images/breaks/break-finish.svg" alt="">
          <span data-i18next="break.finish"></span>
          <span class="tiptext" aria-hidden="true"></span>
        </button>
      </div>
      <footer class="rest-footer"><img src="images/brand/restspark-mark-teal.svg" alt=""><span data-i18next="quietRest.footer"></span></footer>
      <div class="break-clock"></div>
    </div>
    <img class="rest-illustration" src="images/quiet-rest/stretch.png" alt="" aria-hidden="true">
  </body>
  <script type="module" src="./microbreak-renderer.js"></script>
</html>
