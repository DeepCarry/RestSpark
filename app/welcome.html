<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Rest Spark</title>
  <link rel="stylesheet" href="css/quiet-rest.css">
  <link rel="stylesheet" href="css/prd-v1.1.css">
</head>
<body class="quiet-rest onboarding">
  <aside class="welcome-brand">
    <div class="brand"><img src="images/brand/restspark-icon-256.png" alt=""><strong data-i18next="prd11.brand"></strong></div>
    <p data-i18next="prd11.brandLine"></p>
  </aside>
  <main class="welcome-main">
    <nav class="steps" aria-label="Setup">
      <span id="mode-step" aria-current="step" data-i18next="prd11.modeStep"></span>
      <span id="prefs-step" data-i18next="prd11.prefsStep"></span>
    </nav>
    <p id="preview-note" hidden data-i18next="prd11.previewOnly"></p>
    <section id="mode">
      <h1 tabindex="-1" data-i18next="prd11.modeHeading"></h1>
      <fieldset class="presets">
        <legend class="sr-only" data-i18next="prd11.modeHeading"></legend>
        <label><input type="radio" name="preset" value="eyes"><strong data-i18next="prd11.eyes"></strong><span data-i18next="prd11.eyesDetail"></span></label>
        <label><input type="radio" name="preset" value="balanced" checked><strong data-i18next="prd11.balanced"></strong><span data-i18next="prd11.balancedDetail"></span></label>
        <label><input type="radio" name="preset" value="deep"><strong data-i18next="prd11.deep"></strong><span data-i18next="prd11.deepDetail"></span></label>
      </fieldset>
      <div class="welcome-actions"><button class="primary" id="next" data-i18next="prd11.next"></button></div>
    </section>
    <section id="prefs" hidden>
      <h1 tabindex="-1" data-i18next="prd11.prefsHeading"></h1>
      <div class="setup-settings">
        <label><span data-i18next="settingsV1.login"></span><input type="checkbox" id="login" role="switch"></label>
        <label><span data-i18next="prd11.followFocus"></span><input type="checkbox" id="focus" role="switch" checked></label>
        <label><span data-i18next="prd11.gentle"></span><input type="checkbox" id="notify" role="switch" checked></label>
      </div>
      <p id="chosen-preset"></p>
      <div class="welcome-actions">
        <button id="back" data-i18next="prd11.back"></button>
        <button id="skip" data-i18next="prd11.useDefaults"></button>
        <button class="primary" id="complete" data-i18next="prd11.start"></button>
      </div>
      <p id="setup-error" role="alert" hidden data-i18next="prd11.saveError"></p>
    </section>
  </main>
  <script type="module" src="welcome-renderer.js"></script>
</body>
</html>
