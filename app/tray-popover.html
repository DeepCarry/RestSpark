<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Rest Spark</title>
  <link rel="stylesheet" href="css/quiet-rest.css">
  <link rel="stylesheet" href="css/prd-v1.1.css">
</head>
<body class="quiet-rest popover">
  <main class="popover-surface" aria-label="Rest Spark">
    <header class="popover-header">
      <div class="brand"><img src="images/brand/restspark-icon-256.png" alt=""><strong data-i18next="prd11.brand"></strong></div>
      <button id="settings" data-i18next="main.preferences"></button>
    </header>
    <section id="overview">
      <div id="status-card" class="status-card">
        <h1 id="status" role="status"></h1>
        <p id="countdown" role="timer" aria-live="off"></p>
        <progress id="progress" max="100" value="0" hidden></progress>
        <p id="detail"></p>
      </div>
      <div id="next-card" class="next-card" hidden>
        <strong id="next-type"></strong><p id="next-detail"></p>
      </div>
      <p id="focus-unavailable" class="compatibility" hidden data-i18next="prd11.focusUnavailable"></p>
      <div class="popover-actions">
        <button id="pause" class="primary" data-i18next="prd11.pause"></button>
        <button id="resume" class="primary" hidden data-i18next="prd11.resumeEarly"></button>
        <button id="change" hidden data-i18next="prd11.changeTime"></button>
        <button id="rest"></button>
      </div>
      <p id="resume-rule" class="next-card compatibility" hidden data-i18next="prd11.pauseResets"></p>
      <footer id="summary"></footer>
    </section>
    <section id="options" hidden>
      <h1 tabindex="-1" data-i18next="prd11.pickDeadline"></h1>
      <div id="choices"></div>
      <button id="cancel" data-i18next="prd11.back"></button>
    </section>
  </main>
  <script type="module" src="tray-popover-renderer.js"></script>
</body>
</html>
